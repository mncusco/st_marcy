<!DOCTYPE html>
<html lang="{{ language or 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ST Care{% endblock %}</title>
</head>
<body style="font-family:Georgia,serif;background:#f5f2ec;color:#2c2c2c;padding:40px 20px;margin:0;">
<div style="max-width:600px;margin:0 auto;background:#fff;border:1px solid #e8e3da;padding:40px;">
<div style="text-align:center;margin-bottom:30px;">
    <span style="font-size:24px;letter-spacing:2px;color:#2d5a27;">ST</span>
    <span style="font-size:24px;letter-spacing:2px;color:#b89a5a;">CARE</span>
</div>
{% block content %}{% endblock %}
<div style="margin-top:32px;padding-top:20px;border-top:1px solid #e8e3da;text-align:center;font-size:11px;color:#8c8c8c;">
    <p>Shamanic Travels &middot; ST Care Team</p>
    <p>{{ _contact_email or '' }}</p>
</div>
</div>
</body>
</html>
