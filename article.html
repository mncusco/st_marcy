<style>
:root {

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

body {

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 9999;
  background: rgba(245,242,236,0.98);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  color: var(--foreground);
}
.nav-inner {
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1280px;
  margin: 0 auto;
}
.nav-brand {
  display: flex; align-items: center; gap: 12px;
  text-decoration: none; color: inherit;
}
.nav-logo { width: 40px; height: 40px; object-fit: contain; display: block; }
.nav-brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 22px; letter-spacing: -0.02em;
}
.nav-links { display: flex; gap: 40px; list-style: none; }
.nav-links a { color: inherit; text-decoration: none; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; }
.nav-links a.apply { color: var(--gold-soft); }
.nav-links a.active { color: var(--accent); }

.nav-mobile-toggle {
  display: none; flex-direction: column; justify-content: center;
  align-items: flex-end; gap: 6px; width: 36px; height: 36px;
  background: none; border: none; cursor: pointer; padding: 8px;
}
.nav-mobile-toggle span { display: block; height: 1px; background: currentColor; }
.nav-mobile-toggle span:first-child { width: 20px; }
.nav-mobile-toggle span:last-child  { width: 16px; }

/* ── ARTICLE HERO ── */
.article-hero {
  padding-top: 100px;
  position: relative;
  overflow: hidden;
}
.article-hero-img {
  width: 100%;
  height: 60vh;
  min-height: 400px;
  object-fit: cover;
  display: block;
}
.article-hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%);
}
.article-hero-content {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 48px 40px;
  color: white;
  max-width: 1280px;
  margin: 0 auto;
}
.article-hero-meta {
  display: flex;
  gap: 24px;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.article-hero-category { color: var(--gold-soft); }
.article-hero-date { color: rgba(255,255,255,0.6); }
.article-hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(36px, 5vw, 72px);
  font-weight: 300;
  line-height: 1.05;
  margin-bottom: 16px;
  color: white;
}
.article-hero-subtitle {
  font-size: 15px;
  color: rgba(255,255,255,0.75);
  max-width: 600px;
  line-height: 1.7;
}

/* ── ARTICLE BODY ── */
.article-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 80px 40px 160px;
}

.article-byline {
  display: flex;
  align-items: center;
  gap: 16px;
  padding-bottom: 48px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 64px;
}
.article-byline-dot {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--stone-deep);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.article-byline-dot span {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;

}

.article-body p {

  margin-bottom: 32px;
}

.article-body p:first-child::first-letter {

  font-size: 72px;
  font-weight: 300;

  line-height: 0.8;

}

/* ── BOTTOM NAV ── */

/* ── PILLAR LINK ── */

.article-pillar {

.article-pillar-label {

/* ── RELATED ── */
.article-related {

/* ── INTERNAL LINKS ── */
.article-links {
  border: 1px solid var(--border);

}
.article-links-label {

.article-links-list {

.article-links-item a {

/* ── NOT FOUND ── */
.article-not-found {

.article-not-found h1 {

.article-not-found a {

/* ── FOOTER ── */
footer {

<script>
const menuBtn = document.getElementById('menuBtn');
const navLinks = document.querySelector('.nav-links');
let menuOpen = false;
menuBtn.addEventListener('click', () => {
  menuOpen = !menuOpen;
  if (menuOpen) {
    navLinks.style.cssText = 'display:flex;flex-direction:column;position:absolute;top:72px;left:0;right:0;background:#f5f2ec;padding:24px 40px;gap:20px;z-index:100;';
    menuBtn.setAttribute('aria-expanded', 'true');
  } else {
    navLinks.style.cssText = 'display:none;';
    menuBtn.setAttribute('aria-expanded', 'false');
  }
});

function formatDate(str) {
  const d = new Date(str);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

function initials(name) {
  return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

const PILLAR_LABELS = {
  'ayahuasca-safety': 'Ayahuasca & Safety',
  'preparation-integration': 'Preparation & Integration',
  'ethics-shamanism': 'Ethics & Shamanism',
  'peru': 'Peru',
  'amazon': 'Amazon',
  'andes': 'Andes',
  'private-journeys': 'Private Journeys',
  'lifestyle-ethos': 'Lifestyle & Ethos'
};

function mdParagraph(text) {
  const esc = String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
  return esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
}

const INTERNAL_BOOK_OK = '/la-montagna-che-portiamo-dentro';

// Rendering sicuro dei link interni: allowlist di destinazioni interne,
// nessun HTML arbitrario, mai link esterni, libro = unico lead magnet.
function renderInternalLinks(article, lang, articles) {
  if (!Array.isArray(article.internal_links) || !article.internal_links.length) return '';

  const typeLabel = {
    it: { book: 'Il libro', article: 'Articolo', pillar: 'Approfondimento' },
    en: { book: 'The Book', article: 'Article', pillar: 'Insight' },
    ru: { book: 'Книга', article: 'Статья', pillar: 'Практика' },
    es: { book: 'El libro', article: 'Artículo', pillar: 'Práctica' },
    sr: { book: 'Knjiga', article: 'Članak', pillar: 'Praksa' }
  }[lang] || {};

  const links = article.internal_links
    .map((l) => {
      if (!l || typeof l !== 'object') return null;
      const text = String(l[`text_${lang}`] || l.text || '');
      const dest = String(l.destination || '');
      const type = String(l.type || '').toLowerCase();

      let ok = false;
      if (type === 'book') {
        ok = dest === INTERNAL_BOOK_OK;
      } else if (type === 'article') {
        const m = dest.match(/^\/article\?id=([\w-]+)$/);
        ok = !!m && Array.isArray(articles) && articles.some(a => a.slug === m[1] || a.id === m[1]);
      } else if (type === 'pillar') {
        ok = /^\/insights\/[\w-]+\.html$/.test(dest);
      }
      if (!ok || !text) return null;

      return `
        <li class="article-links-item">
          <span class="eyebrow article-links-type">${esc(typeLabel[type] || type)}</span>
          <a href="${dest}">${esc(text)}</a>
        </li>`;
    })
    .filter(Boolean);

  if (!links.length) return '';

  const label = {
    it: 'Approfondisci',
    en: 'Continue reading',
    ru: 'Читать далее',
    es: 'Seguir leyendo',
    sr: 'Nastavi čitanje'
  }[lang] || 'Continue reading';

  return `
    <div class="article-links">
      <span class="eyebrow article-links-label">${esc(label)}</span>
      <div class="article-links-list">${links.join('')}</div>
    </div>`;
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

async function loadArticle() {
  const slug = new URLSearchParams(window.location.search).get('id');
  const container = document.getElementById('articleContent');

  if (!slug) {
    showNotFound(container);
    return;
  }

  try {
    const res = await fetch('/articles.json');
    if (!res.ok) throw new Error();
    const articles = await res.json();
    const article = articles.find(a => a.slug === slug || a.id === slug);

    if (!article) {
      showNotFound(container);
      return;
    }

    // Lingua corrente
    const lang = localStorage.getItem('st_lang') || navigator.language.slice(0,2) || 'it';

    // Selezione campo localizzato con fallback all'italiano
    const t = (field) => article[`${field}_${lang}`] || article[field] || '';
    const bodyField = article[`body_${lang}`] || article.body || [];
    const bodyParagraphs = bodyField.map(p => `<p>${mdParagraph(p)}</p>`).join('');

    // Update page title & meta (localized)
    document.title = `${t('title')} — ShamanicTravels`;
    document.querySelector('meta[name="description"]').setAttribute('content', t('excerpt'));

    // Canonical + Open Graph (valori statici non possibili: pagina cliente)
    const SITE = 'https://www.shamanictravels.com';
    const artCanonical = document.getElementById('artCanonical');
    if (artCanonical) artCanonical.setAttribute('href', `${SITE}/article?id=${slug}`);
    const ogFields = { artOgTitle: `${t('title')} — ShamanicTravels`, artOgDesc: t('excerpt') || '', artOgUrl: `${SITE}/article?id=${slug}`, artOgImage: `${SITE}/${article.image || 'insights.jpg'}` };
    Object.keys(ogFields).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.setAttribute('content', ogFields[id]);
    });

    // Banner lingua se articolo non disponibile nella lingua corrente
    const hasTranslation = lang === 'it' || !!article[`body_${lang}`];
    const langBanner = !hasTranslation ? `
      <div style="background:rgba(185,154,90,0.1);border-left:3px solid var(--accent);padding:12px 20px;margin-bottom:32px;font-size:13px;color:var(--muted);">
        <span style="font-style:italic;">Questo articolo è disponibile solo in italiano.</span>
      </div>` : '';

    const backLabel = { it:'← Tutti gli articoli', en:'← All Insights', es:'← Todos los artículos', ru:'← Все статьи', sr:'← Svi članci' }[lang] || '← All Insights';
    const ctaLabel = { it:'Prenota un colloquio privato', en:'Request Private Interview', es:'Solicitar entrevista privada', ru:'Запросить интервью', sr:'Zatraži privatni razgovor' }[lang] || 'Request Private Interview';
    const roleLabel = { it:'Guida e Fondatore · ShamanicTravels', en:'Guide & Founder · ShamanicTravels', es:'Guía y Fundador · ShamanicTravels', ru:'Гид и основатель · ShamanicTravels', sr:'Vodič i osnivač · ShamanicTravels' }[lang] || 'Guide & Founder · ShamanicTravels';
    const backCollectionLabel = { it:'Ritorna alla collezione', en:'Back to collection', es:'Volver a la colección', ru:'Вернуться к коллекции', sr:'Nazad na kolekciju' }[lang] || 'Back to collection';
    const relatedLabel = { it:'Approfondimenti correlati', en:'Further reading', es:'Lecturas relacionadas', ru:'Дополнительное чтение', sr:'Dalje čitanje' }[lang] || 'Further reading';

    const displayCategory = (lang === 'it') ? (article.category || article.category_en || '') : (article.category_en || article.category || '');
    const pillarLabel = PILLAR_LABELS[article.category_key] || article.category_en || article.category || '';
    const related = (articles || [])
      .filter(a => (article.related || []).includes(a.slug))
      .filter(a => a.slug !== article.slug);

    container.innerHTML = `
      <div class="article-hero">
        <img
          src="${article.image || 'insights.jpg'}"
          alt="${t('title')}"
          class="article-hero-img">
        <div class="article-hero-overlay"></div>
        <div class="article-hero-content">
          <div class="article-hero-meta">
            ${article.category_key ? `<a href="/insights/${article.category_key}" class="eyebrow article-hero-category">${displayCategory}</a>` : `<span class="eyebrow article-hero-category">${displayCategory}</span>`}
            <span class="eyebrow article-hero-date">${formatDate(article.date)}</span>
          </div>
          <h1 class="article-hero-title">${t('title')}</h1>
          <p class="article-hero-subtitle">${t('subtitle')}</p>
        </div>
      </div>

      <div class="article-wrap">
        <div class="article-byline">
          <div class="article-byline-dot">
            <span>${initials(article.author)}</span>
          </div>
          <div>
            <p class="article-byline-name">${article.author}</p>
            <p class="eyebrow article-byline-role">${roleLabel}</p>
          </div>
        </div>
        ${langBanner}
        <div class="article-body">${bodyParagraphs}</div>
        ${renderInternalLinks(article, lang, articles)}
      </div>

      ${article.category_key ? `
      <div class="article-pillar">
        <span class="eyebrow article-pillar-label">${backCollectionLabel}</span>
        <a href="/insights/${article.category_key}" class="article-pillar-link">${pillarLabel} →</a>
      </div>` : ''}

      ${related.length ? `
      <div class="article-related">
        <span class="eyebrow article-related-label">${relatedLabel}</span>
        <div class="article-related-list">
          ${related.map(r => `
          <a href="/article?id=${r.slug}" class="article-related-item">
            <span class="eyebrow">${r.category_en || r.category || ''}</span>
            <h3>${r[`title_${lang}`] || r.title || ''}</h3>
          </a>`).join('')}
        </div>
      </div>` : ''}

      <div class="article-bottom">
        <a href="/blog" class="eyebrow article-back">${backLabel}</a>
        <a href="/apply_clean" class="article-cta eyebrow">${ctaLabel}</a>
      </div>

      <footer>
        <p class="eyebrow footer-copy">© 2026 ShamanicTravels · Private Curated Journeys</p>
      </footer>
    `;

    if (article.trusted === true) {
      const ld = {
        '@context': 'https://schema.org',
        '@type': 'Article',
        'headline': article.title || '',
        'description': article.excerpt || '',
        'image': `${SITE}/${article.image || 'insights.jpg'}`,
        'datePublished': article.date || '',
        'dateModified': article.updated || article.date || '',
        'inLanguage': lang === 'it' ? 'it' : 'en',
        'author': { '@type': 'Person', 'name': article.author || 'Marcello Buglione' },
        'publisher': {
          '@type': 'Organization',
          'name': 'ShamanicTravels',
          'url': SITE,
          'logo': { '@type': 'ImageObject', 'url': `${SITE}/logo.png` }
        },
        'mainEntityOfPage': `${SITE}/article?id=${slug}`
      };
      const tag = document.createElement('script');
      tag.type = 'application/ld+json';
      tag.textContent = JSON.stringify(ld);
      document.head.appendChild(tag);
    }
  } catch (e) {
    showNotFound(container);
  }
}

function showNotFound(container) {
  container.innerHTML = `
    <div class="article-not-found">
      <h2>Article not found</h2>
      <p>This article may have moved or does not exist.</p>
      <a href="/blog" class="eyebrow">← Return to Insights</a>
    </div>
    <footer>
      <p class="eyebrow footer-copy">© 2026 ShamanicTravels · Private Curated Journeys</p>
    </footer>
  `;
}

loadArticle();
</script>
<script src="i18n.js"></script>
<script>
i18n.init();
</script>
</body>
