<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apply for Selection — Private Interview · Shamanic Travels</title>

<meta name="description" content="Request a private interview for invitation-only journeys in Peru. Maximum six participants per group. Application required.">
<meta name="author" content="Shamanic Travels">
<meta name="robots" content="noindex,follow">

<!-- Open Graph -->
<meta property="og:title" content="Apply for Selection — Private Interview">
<meta property="og:description" content="Invitation-only journeys in Peru. Private selection process.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://shamanictravels.com/apply">
<meta property="og:image" content="https://shamanictravels.com/og.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#f5f2ec;
  --fg:#1a1612;
  --muted:#8a8278;
  --border:rgba(26,22,18,.12);
  --accent:#b89a5a;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:Inter,sans-serif;
  font-weight:300;
  line-height:1.6;
}

.serif{font-family:"Cormorant Garamond",serif}

.container{
  max-width:900px;
  margin:0 auto;
  padding:120px 24px;
}

h1{
  font-family:"Cormorant Garamond",serif;
  font-weight:300;
  font-size:42px;
  margin-bottom:20px;
}

p{color:var(--muted)}

form{margin-top:60px}

.field{margin-bottom:24px;display:flex;flex-direction:column}

label{
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
  margin-bottom:8px;
  color:var(--muted);
}

input,textarea{
  border:none;
  border-bottom:1px solid var(--border);
  padding:10px 0;
  background:transparent;
  font-size:15px;
  outline:none;
}

input:focus,textarea:focus{
  border-bottom-color:var(--accent);
}

button{
  margin-top:40px;
  padding:16px 40px;
  border:1px solid var(--fg);
  background:none;
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:.2em;
  font-size:10px;
}

button:hover{
  background:var(--fg);
  color:var(--bg);
}

.note{
  margin-top:16px;
  font-size:12px;
  color:var(--muted);
}
</style>

<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
</script>

</head>

<body>

<div class="container">

  <h1 class="serif">Private Interview Application</h1>

  <p>
    This experience is invitation-only. Only a limited number of interviews are granted each cycle.
  </p>

  <form id="applyForm" onsubmit="handleSubmit(event)">

    <div class="field">
      <label>Full name</label>
      <input id="fullName" required>
    </div>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email" required>
    </div>

    <div class="field">
      <label>Phone</label>
      <input id="phone" type="tel" required>
    </div>

    <div class="field">
      <label>Age</label>
      <input id="age" type="number" min="21" required>
    </div>

    <div class="field">
      <label>Country</label>
      <input id="country" required>
    </div>

    <div class="field">
      <label>Profession</label>
      <input id="job" required>
    </div>

    <div class="field">
      <label>Why do you want this journey?</label>
      <textarea id="motivation" rows="6" required placeholder="Be direct. We are not evaluating writing style, but clarity of intention."></textarea>
    </div>

    <button type="submit">Submit Application</button>

    <p class="note">
      Your application is reviewed privately. If selected, you will be contacted within ten days.
    </p>

  </form>

</div>

<script>
function handleSubmit(e){
  e.preventDefault();

  const name=document.getElementById('fullName').value;
  const email=document.getElementById('email').value;
  const motivation=document.getElementById('motivation').value;

  const body=
`New Shamanic Travels Application

Name: ${name}
Email: ${email}

Motivation:
${motivation}`;

  // tracking
  if (typeof gtag === "function") {
    gtag('event','apply_submit',{event_category:'engagement'});
  }

  // send
  window.location.href =
  `mailto:shamanictravels@gmail.com?subject=Application — ${encodeURIComponent(name)}&body=${encodeURIComponent(body)}`;
}
</script>

</body>
</html>
