<style>
/* ── TOKENS ── */
:root {
  --background: #f5f2ec;
  --foreground: #1a1612;
  --muted: #8a8278;
  --border: rgba(26,22,18,0.12);
  --accent: #b89a5a;
  --gold-soft: #c9a96e;
  --stone-deep: #1e1b16;
  --earth: #d4ccc0;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  background: var(--background);
  color: var(--foreground);
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── TYPOGRAPHY ── */
.font-serif { font-family: 'Cormorant Garamond', serif; }

.eyebrow {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

/* ── UTILITIES ── */
.text-accent { color: var(--accent); }
.text-muted { color: var(--muted); }
.italic { font-style: italic; }

.link-underline {
  position: relative;
  text-decoration: none;
}
.link-underline::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0;
  width: 0; height: 1px;
  background: currentColor;
  transition: width 0.35s ease;
}
.link-underline:hover::after { width: 100%; }

/* ── ANIMATIONS ── */
@keyframes slowZoom {
  from { transform: scale(1.06); }
  to { transform: scale(1.00); }
}
@keyframes revealUp {
  from { opacity:0; transform: translateY(24px); }
  to { opacity:1; transform: translateY(0); }
}

.animate-slow-zoom { animation: slowZoom 20s cubic-bezier(0.22,1,0.36,1) forwards; }
.animate-reveal { opacity:0; animation: revealUp 1s cubic-bezier(0.22,1,0.36,1) 0.3s forwards; }
.animate-reveal-delay-1 { animation-delay: 0.6s; }
.animate-reveal-delay-2 { animation-delay: 0.9s; }
.animate-reveal-delay-3 { animation-delay: 1.2s; }

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;

  border-bottom: 1px solid rgba(255,255,255,0.08);
  color: white;
}

nav.scrolled {
  background: rgba(245,242,236,0.98);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(26,22,18,0.12);

}

.nav-inner {

}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: inherit;
}

.nav-logo {
  width: 40px; height: 40px;

  display: block;
}

.nav-brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 22px;
  letter-spacing: -0.02em;
}

}

.nav-links a {
  color: inherit;
  text-decoration: none;
  font-size: 10px;

}

nav.scrolled.nav-links a.apply { color: var(--gold-soft); }

}

  display: block;

  background: currentColor;
