/* ── TOKENS ── */
:root {
  --background:    #f5f2ec;
  --foreground:    #1a1612;
  --muted:         #8a8278;
  --border:        rgba(26,22,18,0.12);
  --accent:        #b89a5a;
  --gold-soft:     #c9a96e;
  --stone-deep:    #1e1b16;
  --earth:         #d4ccc0;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  background: var(--background);
  color: var(--foreground);
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── TYPOGRAPHY ── */
.font-serif { font-family: 'Cormorant Garamond', serif; }

.eyebrow {
  font-family: 'Inter', sans-serif;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

/* ── UTILITIES ── */
.text-accent   { color: var(--accent); }
.text-muted    { color: var(--muted); }
.italic        { font-style: italic; }
.text-balance  { text-wrap: balance; }
.text-pretty   { text-wrap: pretty; }

.link-underline {
  position: relative;
  text-decoration: none;
}
.link-underline::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0;
  width: 0; height: 1px;
  background: currentColor;
  transition: width 0.35s ease;
}
.link-underline:hover::after { width: 100%; }

/* ── ANIMATIONS ── */
@keyframes slowZoom {
  from { transform: scale(1.06); }
  to   { transform: scale(1.00); }
}

@keyframes revealUp {
  from { opacity:0; transform: translateY(24px); }
  to   { opacity:1; transform: translateY(0); }
}

.animate-slow-zoom {
  animation: slowZoom 20s cubic-bezier(0.22,1,0.36,1) forwards;
}

.animate-reveal {
  opacity: 0;
  animation: revealUp 1s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;
}
.animate-reveal-delay-1 { animation-delay: 0.6s; }
.animate-reveal-delay-2 { animation-delay: 0.9s; }
.animate-reveal-delay-3 { animation-delay: 1.2s; }

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  transition: background 0.7s;
  mix-blend-mode: difference;
  color: white;
}

.nav-inner {
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: inherit;
}

.nav-logo {
  width: 36px; height: 36px;
  object-fit: contain;
  display: block;
}

.nav-brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 22px;
  letter-spacing: -0.02em;
}

.nav-links {
  display: flex;
  gap: 40px;
  list-style: none;
}

.nav-links a {
  color: inherit;
  text-decoration: none;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.nav-links a.apply { color: var(--gold-soft); }

.nav-mobile-toggle {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: flex-end;
  gap: 6px;
  width: 36px; height: 36px;
  background: none; border: none;
  cursor: pointer; padding: 8px;
}
.nav-mobile-toggle span {
  display: block;
  height: 1px;
  background: currentColor;
  transition: all 0.3s;
}
.nav-mobile-toggle span:first-child { width: 20px; }
.nav-mobile-toggle span:last-child  { width: 16px; }

/* ── HERO ── */
#hero {
  position: relative;
  height: 100svh;
  min-height: 640px;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
}

@media (min-width: 768px) {
  #hero { align-items: center; }
}

.hero-img-wrap {
  position: absolute;
  inset: 0;
  z-index: 0;
}

.hero-img-wrap img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.7) 100%);
}

.hero-content {
  position: relative;
  z-index: 10;
  text-align: center;
  max-width: 900px;
  padding: 0 24px 80px;
  color: white;
}

@media (min-width: 768px) {
  .hero-content { padding-bottom: 0; }
}

.hero-eyebrow {
  color: rgba(255,255,255,0.7);
  margin-bottom: 32px;
}

.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(44px, 8vw, 96px);
  font-weight: 300;
  line-height: 0.95;
  margin-bottom: 40px;
  color: white;
}

.hero-title .gold { color: var(--gold-soft); }

.hero-subtitle {
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.85);
  max-width: 480px;
  margin: 0 auto 48px;
  line-height: 1.8;
}

.hero-cta {
  display: inline-block;
  padding: 20px 40px;
  background: white;
  color: var(--foreground);
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  text-decoration: none;
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  transition: background 0.5s, color 0.5s;
}
.hero-cta:hover { background: var(--accent); color: white; }

.hero-scroll {
  position: absolute;
  bottom: 24px; left: 0; right: 0;
  z-index: 10;
  display: flex;
  justify-content: center;
  pointer-events: none;
}
.hero-scroll-inner {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
}
.hero-scroll-line {
  width: 40px; height: 1px;
  background: rgba(255,255,255,0.4);
}

/* ── ETHOS ── */
#experience {
  padding: 96px 40px 160px;
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr;
  gap: 48px;
  align-items: center;
}

@media (min-width: 768px) {
  #experience {
    grid-template-columns: 7fr 5fr;
    gap: 80px;
  }
}

.ethos-left { order: 2; }
